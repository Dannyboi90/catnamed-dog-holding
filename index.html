:root {
  --color-surface-canvas: #FAFAF8; --color-surface-photo: #ECEBE7; --color-surface-raised: #FFFFFF;
  --color-text-primary: #1D1D1F; --color-text-secondary: #62626A; --color-text-on-accent: #FFFFFF;
  --color-accent-default: #3454D1; --color-link-hover: #2A44B0; --color-focus-ring: #3454D1;
  --color-border-subtle: #DEDEE2; --color-border-control: #86868F; --color-surface-selection: #D9E0FA;
  --color-feedback-info-surface: #E9EDFB; --color-feedback-info-text: #2A44B0;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--color-surface-canvas); color: var(--color-text-primary); font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
::selection { background: var(--color-surface-selection); }
.wrap { --pad: 16px; width: 100%; max-width: 1080px; margin: 0 auto; padding-left: var(--pad); padding-right: var(--pad); }
@media (min-width: 600px) { .wrap { --pad: clamp(32px, 7vw, 80px); } }
header .wrap { padding-top: 24px; padding-bottom: 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.wordmark { display: inline-flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 650; letter-spacing: -0.01em; }
.wordmark::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--color-accent-default); }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; line-height: 1.3; padding: 3px 10px; border: 1px solid var(--color-border-control); border-radius: 9999px; }
.hero { display: grid; grid-template-columns: 1fr; gap: 40px; align-items: center; padding-top: 32px; padding-bottom: 56px; }
@media (min-width: 760px) { .hero { grid-template-columns: minmax(0, 1fr) min(25vw, 320px); gap: clamp(40px, 6vw, 80px); padding-top: 48px; padding-bottom: 72px; } }
h1 { margin: 0; font-size: clamp(56px, 8vw, 104px); line-height: 1.22; font-weight: 650; letter-spacing: -0.035em; text-wrap: balance; }
.lede { margin: 26px 0 0; max-width: 31em; font-size: clamp(17px, 1.7vw, 19px); line-height: 1.3; color: var(--color-text-secondary); }
.btn { display: inline-flex; align-items: center; gap: 8px; margin-top: 22px; min-height: 40px; padding: 0 18px; border-radius: 7px; background: var(--color-accent-default); color: var(--color-text-on-accent); font-size: 15px; font-weight: 600; text-decoration: none; transition: background 120ms cubic-bezier(0.2, 0, 0, 1); }
.btn:hover { background: var(--color-link-hover); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--color-focus-ring); outline-offset: 3px; border-radius: 10px; }
figure { margin: 0; justify-self: center; width: 100%; max-width: 360px; }
.photo { display: block; width: 100%; height: auto; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 14px; background: var(--color-surface-photo); }
figcaption { margin-top: 10px; font-size: 15px; line-height: 1.45; color: var(--color-text-secondary); }
footer .wrap { padding-top: 20px; padding-bottom: 28px; position: relative; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; font-size: 14px; line-height: 1.5; color: var(--color-text-secondary); }
footer .wrap::before { content: ""; position: absolute; top: 0; left: var(--pad); right: var(--pad); border-top: 1px solid var(--color-border-subtle); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
